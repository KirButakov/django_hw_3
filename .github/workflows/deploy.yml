name: Django CI/CD

on:
  push:
    branches:
      - homework

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: my_project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with SQLite
        working-directory: my_project
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USER }}@${{ secrets.HOST_1994 }} << 'EOF'
          set -e  # Остановить скрипт при ошибке

          echo "==== Checking server directories ===="
          PROJECT_DIR="/home/${{ secrets.USER }}/my_project"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Project directory not found. Creating it..."
            mkdir -p "$PROJECT_DIR"
            chown ${{ secrets.USER }}:${{ secrets.USER }} "$PROJECT_DIR"
            chmod 755 "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR" || exit 1

          echo "==== Updating project code ===="
          if [ -d ".git" ]; then
            git config --global --add safe.directory "$PROJECT_DIR"
            git reset --hard
            git pull origin homework || { echo "Git pull failed!"; exit 1; }
          else
            echo "Error: Git repository not found!"
            exit 1
          fi

          echo "==== Checking for docker-compose.yml ===="
          if [ ! -f "my_project/docker-compose.yml" ]; then
            echo "Error: docker-compose.yml not found!"
            exit 1
          fi

          echo "==== Loading environment variables ===="
          if [ -f "my_project/.env" ]; then
            export $(grep -v '^#' my_project/.env | xargs)
          else
            echo "Error: .env file not found!"
            exit 1
          fi

          echo "==== Stopping existing containers ===="
          sudo docker-compose -f my_project/docker-compose.yml down || echo "No containers running."

          echo "==== Removing old images ===="
          sudo docker image prune -af || echo "Cleanup failed, continuing..."

          echo "==== Pulling updated Docker images ===="
          sudo docker-compose -f my_project/docker-compose.yml pull || { echo "Docker pull failed!"; exit 1; }

          echo "==== Adding user to Docker group ===="
          sudo usermod -aG docker $USER
          newgrp docker || echo "Docker group switch failed, continuing..."

          echo "==== Starting Docker containers ===="
          sudo docker-compose -f my_project/docker-compose.yml up --build -d
          sleep 5
          sudo docker ps -a || { echo "Docker container failed to start!"; exit 1; }

          echo "==== Running database migrations ===="
          sudo docker exec -i my_project_web python manage.py migrate || { echo "Migration failed!"; exit 1; }

          echo "==== Collecting static files ===="
          sudo docker exec -i my_project_web python manage.py collectstatic --noinput || { echo "Collectstatic failed!"; exit 1; }

          echo "==== Cleaning up unused Docker images ===="
          sudo docker image prune -af || echo "Cleanup failed, continuing..."
          EOF














